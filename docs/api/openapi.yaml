# The daemon's HTTP control surface, as OpenAPI 3.1.
#
# Ground truth is packages/cli/src/daemon/routes.ts (dispatch, one manual
# match per route) and packages/cli/src/daemon/wire.ts (what a resource
# looks like once it leaves the process). This file is derived from those
# two files, plus packages/cli/src/daemon/studio/routes.ts for the /studio
# routes and the authentication gate, and must be re-derived when they
# change (last re-derived 2026-10-30, issue #143); it is documentation, not
# a schema the daemon enforces.
#
# Not documented here: the queue producer endpoint on queuePort (a container's
# producer shim speaks to it with a per-queue bearer token, ADR 0013) and the
# wake router's proxy ports (5432/HTTP), which speak Postgres wire protocol
# and plain HTTP respectively, not this API.

openapi: 3.1.0
info:
  title: Hobbyist daemon API
  version: "1.0"
  description: |
    The only control surface. CLI, Studio and MCP are three clients of this
    one API; none of them touches Postgres or Docker directly.

    Listeners. The unix socket (`~/.hobby/hobby.sock`, the CLI's and MCP's
    transport) is unauthenticated: filesystem permissions are the whole
    story. The loopback TCP listener (`apiPort`, default 7432), which also
    serves Studio and is what Caddy or a tailnet exposes, is gated
    (`isAuthenticated`, packages/cli/src/daemon/studio/routes.ts): every
    `/v1` route there needs either the operator session cookie
    (`hobby_studio_session`, set by POST /studio/login) or an API token as
    `Authorization: Bearer <token>` (ADR 0018). Only `/studio/login`,
    `/studio/logout`, `/studio/session`, `/studio/token` and `/v1/health`
    answer unauthenticated there (`UNAUTHENTICATED_PATHS`). A request that
    fails the gate gets 401 `{ "error": { "code": "unauthorized", "message":
    "authentication required" } }`.

    Tokens are minted by `hobby token create` on the box (a file under
    `~/.hobby`, never a route) or by POST /studio/token with the operator
    password (what `hobby login` calls). `hobby token ls` and `hobby token
    rm` are likewise local file operations with no route, so a leaked token
    cannot list or mint others.

    Every error is the one envelope: `{ "error": { "code", "message",
    "hint"? } }`. Codes map to statuses as: project_not_found,
    resource_not_found and not_found 404; name_taken and conflict 409;
    invalid_name and usage 400; unauthorized 401; too_many_attempts 429
    (with a Retry-After header); build_failed 422; runtime_unavailable 503;
    wake_timeout 504; disk_full 507; ambiguous_target, wake_failed,
    not_ready, unknown_kind and internal 500. A method and path no route
    matches is 404 not_found on every listener (`dispatch`, routes.ts), so
    it is not repeated per operation below. too_many_attempts comes from
    the login throttle (`LoginThrottle`, studio/auth.ts), which the
    password routes and the bearer-token gate share: inside a source
    address's backoff window the message is `too many attempts, retry in
    Ns`. A bearer token is found by a short lookup key stored beside its
    hash, so a bad token costs about what no header costs
    (`verifyToken`, studio/tokens.ts).

    Request bodies are JSON, capped at 64KB. Secrets never cross this
    boundary in resource payloads: postgres `config.password` is omitted
    entirely, app `env` and worker `vars` values read as `<redacted>`. The
    two deliberate exceptions are GET /v1/resources/{id}/connection (the
    connection string is the point) and eject's rendered compose file (a
    compose file that cannot start Postgres would break the leaving
    promise).
servers:
  - url: http://127.0.0.1:7432
    description: daemon loopback API (default apiPort). Gated, see below.
  - url: http://localhost
    description: the unix socket at ~/.hobby/hobby.sock, ungated. The host part is ignored.

# Applies to every /v1 route on the loopback listener. Not to the unix
# socket, and not to the /studio routes, which each say what they need.
security:
  - sessionCookie: []
  - bearerToken: []

paths:
  /v1/health:
    get:
      summary: Liveness. Always unauthenticated, even studio-fronted.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { status: { const: ok } }

  /v1/version:
    get:
      summary: "The daemon's build version (CLI_VERSION, packages/cli/src/version.ts). Its own route rather than a field on /v1/health because health answers unauthenticated on the studio listener and a build number should not."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }

  /v1/preflight:
    get:
      summary: Host capability report. Read-only, safe to poll; feeds Studio's capacity panel.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preflight" }

  /v1/projects:
    get:
      summary: List projects.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      summary: Create a project. Name rules from core's validateName.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{1,62}$"
                  description: Lowercase, digits, dashes; reserved names (postgres, template0, template1, hobby) refused.
                sleepAfterSeconds:
                  type: [integer, "null"]
                  minimum: 1
                  description: "Optional. Omitted takes the daemon's config default; null pins the project awake from birth; a positive integer is the project's own idle threshold in seconds."
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}:
    get:
      summary: One project with its resources (wire-shaped, secrets redacted).
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  resources:
                    type: array
                    items: { $ref: "#/components/schemas/WireResource" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete the project and destroy every resource in it. Best-effort teardown; the row always goes, cleanup failures come back as `internal` with the row already deleted.
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { const: true } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/resources:
    post:
      summary: "Create a resource. Kind-discriminated body; postgres and queue need only a name, app takes a source or a prebuilt image or neither (a record with no code, ADR 0014), worker takes a source directory holding a wrangler manifest or neither. A queue is created with no consumer; a worker's manifest binds one."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, name]
                  properties:
                    kind: { const: postgres }
                    name: { type: string }
                - type: object
                  required: [kind, name]
                  properties:
                    kind: { const: app }
                    name: { type: string }
                    source:
                      type: object
                      required: [path]
                      properties:
                        path: { type: string }
                        dockerfile: { type: string, default: Dockerfile }
                        buildArgs: { type: object, additionalProperties: { type: string }, description: "docker build --build-arg values, persisted for redeploys, redacted on the wire" }
                    image: { type: string, description: "Prebuilt image reference; at most one of source and image. No CLI verb sends this, and no route changes it afterwards" }
                    port: { type: integer, default: 3000, description: "Container port, handed to the process as $PORT" }
                    env: { type: object, additionalProperties: { type: string } }
                    databaseResourceId: { type: string, description: "Sibling postgres id; expanded to DATABASE_URL at start" }
                - type: object
                  required: [kind, name]
                  properties:
                    kind: { const: worker }
                    name: { type: string }
                    source:
                      type: object
                      required: [path]
                      properties:
                        path: { type: string, description: "The directory holding the wrangler manifest" }
                        context: { type: [string, "null"], description: "The build context when it is not path: a workspace root to install from. null clears a stored one" }
                    env: { type: object, additionalProperties: { type: string } }
                    databaseResourceId: { type: string }
                - type: object
                  required: [kind, name]
                  properties:
                    kind: { const: queue }
                    name: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
                  ignored:
                    type: array
                    description: "Worker only; wrangler keys read and not acted on, each { key, reason }. Empty for other kinds."
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/eject:
    post:
      summary: Render the leaving papers. Pure read by default; `?release=true` also stops containers and marks the project handed over (rows, credentials and data all kept; `adopt` reverses).
      parameters:
        - { $ref: "#/components/parameters/projectName" }
        - name: release
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  compose: { type: string, description: "docker-compose.yml text; contains the real Postgres password on purpose" }
                  caddyfile: { type: string, description: "Reverse-proxy routes for app/worker hostnames; empty string when nothing is routed" }
                  dataDirs: { type: array, items: { type: string } }
                  released: { type: boolean }
                  notEjectable: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/sleep-policy:
    post:
      summary: "Set the project's sleep policy: null pins it awake (the hibernator skips it entirely), a positive integer is its own idle threshold in seconds."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sleepAfterSeconds]
              properties:
                sleepAfterSeconds:
                  type: [integer, "null"]
                  minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/branch:
    post:
      summary: "Make a new project from a clone of this one's postgres data directories (branchProject, packages/cli/src/daemon/branch.ts). A sleeping source is cloned as it rests; an awake one is quiesced and resumed, and the pause is reported. Refused for a source holding an app, worker or queue, a released source, a resource mid-transition or failed, a taken name, or a pinned source that is awake unless allowPause. The branch starts asleep, unpinned, with the box-wide sleep policy."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "The new project's name" }
                allowPause: { type: boolean, default: false, description: "Accept stopping a pinned, awake source for the copy" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  resources: { type: array, items: { $ref: "#/components/schemas/WireResource" } }
                  clone: { type: string, enum: [reflink, copy], description: "copy if any resource degraded to a byte copy (ext4)" }
                  paused: { type: array, items: { type: string }, description: "Names of the source's resources stopped for the clone and started again; empty for a sleeping source" }
                  pausedMs: { type: [integer, "null"], description: "How long the source was paused; an upper bound that includes the idle check" }
                  resumeFailures: { type: array, items: { type: string }, description: "Source resources that did not start again after the copy" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/crons:
    get:
      summary: "Every worker cron trigger in the project ([triggers] crons in the wrangler manifest), with its next and last firing (listCrons, packages/cli/src/daemon/crons.ts). Read-only; the scheduler is not driven through the API."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  crons:
                    type: array
                    items:
                      type: object
                      properties:
                        worker: { type: string, description: "The worker resource's name" }
                        resourceId: { type: string }
                        cron: { type: string, description: "The schedule as written in the manifest" }
                        nextAt: { type: string, format: date-time }
                        lastAt: { type: [string, "null"], format: date-time }
                        lastOutcome:
                          type: [object, "null"]
                          properties:
                            outcome: { type: string, enum: [ok, exception, unreachable, wake_failed] }
                            detail: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/queues:
    get:
      summary: "The project's queues with depth, the age of the oldest message, and the bound consumer (listQueuesRoute)."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      properties:
                        resource: { $ref: "#/components/schemas/WireQueueResource" }
                        depth: { type: integer }
                        oldestMessageAgeSeconds: { type: [integer, "null"], description: "null when the queue is empty" }
                        consumer: { oneOf: [{ $ref: "#/components/schemas/WireResource" }, { type: "null" }], description: "The bound consumer worker, null when none" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/adopt:
    post:
      summary: Take a released project back. One column changes; conflict if it was never released.
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/projects/{name}/snapshots:
    post:
      summary: "Snapshot the whole project now (ADR 0016): quiesce, clone, write the manifest, resume what was running. With `online: true`, nothing is paused: each running postgres is copied with pg_basebackup inside its own container and each sleeping one is cloned; only a project whose resources are all postgres qualifies (409 otherwise), and the pinned check does not apply. 400 for online and allowPause together. 409 for a pinned project with something running unless allowPause or online, for a released project, or while another snapshot or restore of it is in progress."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowPause: { type: boolean, default: false, description: "Accept stopping a pinned project's running resources for the copy" }
                online: { type: boolean, default: false, description: "Take it with no pause (pg_basebackup for running postgres). Postgres-only projects; cannot be combined with allowPause" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { $ref: "#/components/schemas/SnapshotManifest" }
                  dir: { type: string, description: "Where it landed, on the daemon's box" }
                  resources: { type: array, items: { $ref: "#/components/schemas/WireResource" }, description: "The project's resources after resume, states as recorded" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "507":
          description: "disk_full: the filesystem under HOBBY_HOME ran out of room while the snapshot was being written (ENOSPC or EDQUOT). The message names the path; the partial snapshot was removed (explainSnapshotFailure, snapshots.ts)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    get:
      summary: "The project's snapshots, newest first. Answers for a project that has since been deleted: snapshots outlive it."
      parameters: [{ $ref: "#/components/parameters/projectName" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots: { type: array, items: { $ref: "#/components/schemas/SnapshotManifest" } }

  /v1/snapshots/{id}/restore:
    post:
      summary: "Restore a snapshot. Default: into a new project (`as`, or `<project>-restored`), 201, original untouched. `inPlace: true`: over the project it was taken of, same resource ids, 200; quiesces, swaps the data directory, resumes, and keeps the replaced data until everything that was running is back."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as: { type: string }
                inPlace: { type: boolean, default: false }
                allowPause: { type: boolean, default: false }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/snapshots/{id}:
    delete:
      summary: Delete one snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}:
    get:
      summary: One resource, wire-shaped.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Destroy the resource (container, data directory, row). Kind-agnostic.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { const: true } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/start:
    post:
      summary: Wake. Kind-agnostic; the daemon's verb is start, the product's word is wake. Waits for real readiness before answering.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/stop:
    post:
      summary: Sleep. Kind-agnostic.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/connection:
    get:
      summary: Postgres only. The real connection string through the wake proxy, password included (the point of the route). `tailnetConnectionString` is the same proxy over MagicDNS, null without a tailnet.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectionString: { type: string }
                  tailnetConnectionString: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/logs:
    get:
      summary: Container logs.
      parameters:
        - { $ref: "#/components/parameters/resourceId" }
        - name: tail
          in: query
          schema: { type: integer, default: 200, minimum: 1 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { logs: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/query:
    post:
      summary: Postgres only. Parameterized SQL through the daemon; a sleeping database is woken first (same single-flight wake the proxy uses), and the call counts as activity for the hibernator. Studio's Tables, SQL and Schema all rest on this one route.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: { type: string }
                params: { type: array, description: "Driver-side parameterization; the daemon never touches the SQL string" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/deploy:
    post:
      summary: App or worker only (postgres answers usage; there is nothing to build). Rebuilds, proves the result serves, then replaces the container. Optional body overrides the stored source.
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  required: [path]
                  properties:
                    path: { type: string }
                    dockerfile: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
                  image: { type: string }
                  ignored:
                    type: array
                    description: Worker only; wrangler keys read and not acted on.
                  logs: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/env:
    post:
      summary: "Change an app's or worker's variables without a rebuild (envRoute). `unset` is applied first, then `set`; `replace` swaps the whole set and is what --env-file sends. The new values are read at the next start: a running resource is stopped and its container removed, so the next request wakes it with them. Postgres answers usage. Values are never returned."
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                set: { type: object, additionalProperties: { type: string } }
                unset: { type: array, items: { type: string } }
                replace: { type: object, additionalProperties: { type: string }, description: "When present, the complete new set; set and unset then apply on top of it" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireResource" }
                  keys: { type: array, items: { type: string }, description: "The variable names now set, sorted. Never the values" }
                  stopped: { type: boolean, description: "Whether a running resource was stopped so the change takes effect" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/queue/messages:
    get:
      summary: "Peek at the oldest messages without leasing them (peekQueueRoute), so looking does not change what the consumer receives. Queue resources only."
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1 }
          description: "How many. Anything that is not a positive number means the default of 10 (DEFAULT_PEEK_LIMIT)"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/QueueMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: "Enqueue one message (enqueueRoute). The body is any JSON value and is stored as contentType json. A message for a sleeping consumer wakes it on the next delivery tick."
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { description: "Any JSON value" }
                delaySeconds: { type: integer, minimum: 0, maximum: 86400, description: "Whole seconds before the message becomes deliverable (MAX_DELAY_SECONDS, packages/queue/src/broker.ts)" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "The message id" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: "Delete every message in the queue (purgeQueueRoute). A queue whose database file does not exist yet reports 0."
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: integer, description: "How many messages were deleted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/resources/{id}/queue/retention:
    post:
      summary: "Change how long messages are kept (setRetentionRoute). Cloudflare's own bounds: 60 seconds to 14 days. Note that retention is swept only for a queue with a drainable consumer, so it does not empty a dead letter queue."
      parameters: [{ $ref: "#/components/parameters/resourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retentionSeconds]
              properties:
                retentionSeconds: { type: integer, minimum: 60, maximum: 1209600 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { $ref: "#/components/schemas/WireQueueResource" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /studio/login:
    post:
      summary: "Operator sign-in. Sets the session cookie (hobby_studio_session). Wrong password, unknown password and no-credential-yet all fail with the same generic message; repeated failures are throttled per source address. Unauthenticated by necessity."
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string } }
      responses:
        "200":
          description: "Session cookie set"
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, const: true } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: "too_many_attempts: this address is inside its login backoff window. Retry-After carries the seconds; so does the message. The password was not checked."
          headers:
            Retry-After: { schema: { type: integer }, description: "Seconds until the next attempt is accepted" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /studio/logout:
    post:
      summary: Revoke the session and clear the cookie; it stops authenticating immediately.
      security: []
      responses:
        "200":
          description: "Revoked"
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, const: true } }

  /studio/token:
    post:
      summary: "Issue an API token for another machine, the CLI's half of login (tokenHandler, ADR 0018). Same password, same throttle and same indistinguishable failure as /studio/login. Deliberately not reachable with a token: a token cannot mint another. The plaintext is returned once and only an argon2id hash is stored."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, name]
              properties:
                password: { type: string }
                name: { type: string, description: "A label so the token can be revoked by name with hobby token rm; hobby login defaults it to the hostname" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [token, name]
                properties:
                  token: { type: string, description: "The plaintext token. Shown once" }
                  name: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: "too_many_attempts: same throttle and same shape as /studio/login. hobby login prints the daemon's message rather than 'invalid credentials'."
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /studio/session:
    get:
      summary: Whether the presented cookie authenticates. Unauthenticated by design (it is how the login screen decides to render). A bearer token is not consulted here.
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { authenticated: { type: boolean } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hobby_studio_session
      description: "Set by POST /studio/login (SESSION_COOKIE_NAME, packages/cli/src/daemon/studio/session.ts). Tried first because it is the cheap, in-memory check."
    bearerToken:
      type: http
      scheme: bearer
      description: "An API token from hobby token create or POST /studio/token, as `Authorization: Bearer <token>` (readBearerToken, studio/tokens.ts). Verified against the argon2id hashes stored on the box; revoked by hobby token rm."

  parameters:
    projectName:
      name: name
      in: path
      required: true
      schema: { type: string }
    resourceId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: The one envelope every failure wears.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [project_not_found, resource_not_found, name_taken, invalid_name, ambiguous_target, runtime_unavailable, wake_failed, wake_timeout, not_ready, conflict, usage, unauthorized, unknown_kind, build_failed, too_many_attempts, not_found, disk_full, internal]
            message: { type: string }
            hint: { type: string }

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        networkName: { type: string }
        sleepAfterSeconds: { type: [integer, "null"], description: "null pins the project awake forever" }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, "null"], format: date-time, description: "Set by eject --release; hobby stops acting on the project while set" }

    SnapshotManifest:
      description: "manifest.json as written by takeSnapshot, with each resource's config redacted the same way a WireResource's is (wire.ts, toWireSnapshotManifest). The file on disk is not redacted."
      type: object
      properties:
        version: { type: integer, const: 1 }
        snapshotId: { type: string, description: "Lowercase sortable timestamp plus a random suffix, e.g. 20260816t143000z-a1b2c3" }
        createdAt: { type: string, format: date-time }
        clone: { type: string, enum: [reflink, copy] }
        project:
          type: object
          properties:
            name: { type: string }
            sleepAfterSeconds: { type: [integer, "null"] }
        resources:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string }
              name: { type: string }
              stateAtSnapshot: { type: string, description: "After quiesce for a quiesced snapshot (so sleeping for anything it stopped); the state held throughout the capture for an online one" }
              method: { type: string, enum: [clone, basebackup], description: "clone: cloneTree of data at rest. basebackup: pg_basebackup of a running postgres; its first start runs recovery from backup_label. Absent in manifests written before online snapshots, and reported as clone" }
              config: { type: object }
              durableObjectClasses: { type: array, items: { type: string } }
        verification:
          type: object
          properties:
            status: { type: string, enum: [unverified, verified, failed] }
            at: { type: [string, "null"] }
            detail: { type: [string, "null"] }

    RestoreResult:
      type: object
      properties:
        project: { $ref: "#/components/schemas/Project" }
        resources: { type: array, items: { $ref: "#/components/schemas/WireResource" } }
        restartFailures: { type: array, items: { type: string }, description: "In place only: what was running before and did not come back" }
        preRestoreDir: { type: [string, "null"], description: "In place only: where the replaced data still sits, null once removed" }

    WireResource:
      description: |
        A resource as it crosses the wire (wire.ts). Discriminated on `kind`.
        Three computed fields ride along on every response: `sizeBytes`
        (null when unknown; a sleeping database is never woken to answer),
        `connectionCount` (live, from the proxy's activity tracker) and
        `wakeRefusal` (the daemon's in-memory record of a failed automatic
        wake, null when there is none).
        Redaction by kind: postgres config omits `password` entirely; app
        `env` and worker `vars` values read as `<redacted>`.
      oneOf:
        - $ref: "#/components/schemas/WirePostgresResource"
        - $ref: "#/components/schemas/WireAppResource"
        - $ref: "#/components/schemas/WireWorkerResource"
        - $ref: "#/components/schemas/WireQueueResource"
      discriminator: { propertyName: kind }

    WireQueueResource:
      allOf:
        - $ref: "#/components/schemas/ResourceCommon"
        - type: object
          properties:
            kind: { const: queue }
            config:
              type: object
              description: "QueueConfig (packages/core/src/types.ts). Holds no user secret; the queueToken a producer container presents to the daemon's enqueue listener is the one field redacted (wire.ts)."
              properties:
                retentionSeconds: { type: integer }
                consumerResourceId: { type: [string, "null"], description: "The worker bound as consumer through its wrangler manifest, null when none" }
                maxBatchSize: { type: [integer, "null"] }
                maxBatchTimeoutSeconds: { type: [integer, "null"] }
                maxRetries: { type: [integer, "null"] }
                retryDelaySeconds: { type: [integer, "null"] }
                deadLetterQueue: { type: [string, "null"] }
                queueToken: { type: string, description: "Always <redacted>" }

    QueueMessage:
      description: "A message as peek returns it (toWireMessage, routes.ts): the stored body decoded back to the JSON value that was enqueued, or the raw string if it does not decode."
      type: object
      properties:
        id: { type: string }
        timestampMs: { type: integer, description: "When it was enqueued, milliseconds since the epoch" }
        attempts: { type: integer, description: "Delivery attempts so far" }
        contentType: { type: string, enum: [json, text, bytes, v8] }
        body: { description: "The JSON value, or a string" }

    ResourceCommon:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [creating, running, starting, sleeping, stopping, failed, destroying]
          description: "'undeployed' joins this enum with the record-before-code work; Studio already renders it."
        lastActiveAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: [integer, "null"] }
        connectionCount: { type: integer }
        wakeRefusal:
          type: [object, "null"]
          description: |
            Set when the most recent automatic wake of this resource failed
            (issue #10). Automatic wakes (a proxy connection, an HTTP request,
            the alarm mirror, Studio's query route) are refused until
            `retryAt`, which moves out on a backoff of 30s, 1m, 2m, 4m, 8m,
            then 15m per consecutive failure. A `retryAt` in the past means
            the next automatic wake tries again. Cleared by a successful wake,
            by POST /v1/resources/{id}/start, and by a daemon restart.
          properties:
            failures: { type: integer, description: "Consecutive failed automatic wakes" }
            retryAt: { type: string, format: date-time }
            lastError: { type: string, description: "The failed start's message, with URL credentials and password= values redacted, at most 300 characters" }

    WirePostgresResource:
      allOf:
        - $ref: "#/components/schemas/ResourceCommon"
        - type: object
          properties:
            kind: { const: postgres }
            config:
              type: object
              description: PostgresConfig minus password.
              properties:
                image: { type: string }
                containerName: { type: string }
                hostPort: { type: integer, description: "Published on loopback only" }
                dataDir: { type: string }
                superuser: { type: string }
                database: { type: string }

    WireAppResource:
      allOf:
        - $ref: "#/components/schemas/ResourceCommon"
        - type: object
          properties:
            kind: { const: app }
            config:
              type: object
              properties:
                image: { type: string, description: "Becomes string|null with record-before-code" }
                containerName: { type: string }
                hostPort: { type: integer }
                source:
                  type: [object, "null"]
                  properties:
                    path: { type: string }
                    dockerfile: { type: string }
                containerPort: { type: integer }
                hostname: { type: string, description: "<resource>.<project>.<domain>" }
                env: { type: object, additionalProperties: { type: string }, description: "Values are <redacted>" }
                databaseResourceId: { type: [string, "null"] }

    WireWorkerResource:
      allOf:
        - $ref: "#/components/schemas/ResourceCommon"
        - type: object
          properties:
            kind: { const: worker }
            config:
              type: object
              properties:
                image: { type: string }
                containerName: { type: string }
                hostPort: { type: integer }
                containerPort: { type: integer }
                hostname: { type: string }
                source:
                  type: object
                  properties:
                    path: { type: string }
                    manifest: { type: string }
                compatibilityDate: { type: string }
                compatibilityFlags: { type: array, items: { type: string } }
                vars: { type: object, additionalProperties: { type: string }, description: "Values are <redacted>" }
                kvNamespaces: { type: array, items: { type: string } }
                r2Buckets: { type: array, items: { type: string } }
                d1Databases: { type: array, items: { type: string } }
                queues:
                  type: object
                  properties:
                    producers: { type: array, items: { type: string } }
                    consumers: { type: array, items: { type: string } }
                durableObjects:
                  type: array
                  items:
                    type: object
                    properties:
                      binding: { type: string }
                      className: { type: string }
                durableObjectUniqueKeyModifier: { type: string, description: "Derived once from the resource id; never changes, or Durable Object storage is orphaned" }

    QueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              dataType: { type: string }
        rows:
          type: array
          items: { type: object }
        rowCount: { type: integer }
        command: { type: string }

    Preflight:
      type: object
      properties:
        runtimeAvailable: { type: boolean }
        filesystem:
          type: object
          properties:
            path: { type: string }
            reflinkSupported: { type: boolean, description: "false means branching degrades to a real copy (ext4)" }
            freeBytes: { type: integer }
        proxyHost:
          type: object
          description: "How proxyHost resolved, exactly as startDaemon resolves it (resolveProxyHosts, proxy-hosts.ts). hosts is null and error carries the daemon's refusal when it cannot (tailnet with no tailscaled)."
          properties:
            setting: { type: string }
            hosts: { type: array, items: { type: string }, nullable: true }
            error: { type: string, nullable: true }
        ports:
          type: object
          description: "Every port the daemon binds, probed on the host it binds it on (issue #108). studioPort is not here: nothing listens on it."
          properties:
            proxy: { $ref: "#/components/schemas/PortCheck" }
            api: { $ref: "#/components/schemas/PortCheck", description: "The daemon API, which also serves Studio" }
            http: { $ref: "#/components/schemas/PortCheck" }
            queue: { $ref: "#/components/schemas/PortCheck" }
            caddy:
              type: array
              nullable: true
              description: "80 and 443, probed by connecting rather than binding. null when caddy is off"
              items: { $ref: "#/components/schemas/PortCheck" }
        daemon:
          type: object
          nullable: true
          description: "The machine-wide daemon lock (/tmp/hobby-daemon.lock). null when no lock file exists. self is true when the lock is the answering daemon's own, so its bound ports are expected."
          properties:
            pid: { type: integer }
            home: { type: string }
            startedAt: { type: string }
            running: { type: boolean }
            self: { type: boolean }
        studio:
          type: object
          description: "What Studio exposes (ADR 0008). listen is where the daemon serves it; publicHost is the hostname Caddy publishes it on, or null when nothing off the box reaches it."
          properties:
            listen: { type: string, example: "127.0.0.1:7432" }
            publicHost: { type: string, nullable: true }
        hostNetworking:
          type: object
          nullable: true
          description: "Whether a host-network container can reach this box's loopback. Only probed when caddy is on; null otherwise."
          properties:
            supported: { type: boolean }

    PortCheck:
      type: object
      description: "One port the daemon (or Caddy on its behalf) will bind, and what the probe found (checkPortBindable / checkPortListening, preflight.ts)."
      required: [port, host, bound, error]
      properties:
        port: { type: integer }
        host: { type: string, description: "The address the daemon will bind it on, which is the address it was probed on" }
        bound: { type: boolean, description: "Something else is already listening there" }
        error:
          type: string
          nullable: true
          description: "The errno when the probe could neither bind nor learn the port was taken (EADDRNOTAVAIL for an address this machine does not have, ENOTFOUND for a hostname that does not resolve). The daemon's own bind would fail the same way. null when the port is simply free or simply bound."
