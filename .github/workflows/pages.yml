# Builds hobbyist.sh and publishes it to GitHub Pages.
#
# The decision records on the site are generated from docs/decisions/ at build
# time, so this workflow watches that directory as well as site/. An ADR
# amended without a site rebuild would leave the published copy disagreeing
# with the committed one, and the amendments are the interesting part.

name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/decisions/**'
      - 'packages/cli/src/cli/main.ts'
      # The site serves the installer at /install, generated from this file by
      # prebuild. Without it here, fixing the installer leaves the mirror
      # serving the old bytes, which is the drift the mirror exists to avoid.
      # That happened once already, with a broken script.
      - 'scripts/web-install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site
# is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # There is deliberately no drift check on the decision records. They are
      # generated from docs/decisions/ by the build's own prebuild step and are
      # not committed, so drift is impossible by construction rather than
      # policed after the fact.
      - name: CLI reference matches the binary's help
        working-directory: site
        run: npm run check:cli

      - name: Build
        working-directory: site
        run: npm run build

      - name: Internal links resolve
        working-directory: site
        run: node scripts/check-links.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
