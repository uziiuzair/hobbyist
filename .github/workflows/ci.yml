# The checks a contributor is asked to run before opening a pull request, run
# again here so that asking is not the only enforcement.
#
# This exists because the README now says contributions are welcome. On a
# project whose stated failure mode is the author's attention running out,
# reviewing every contribution by hand is the thing that runs it out.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tests run against compiled output in dist/ rather than sources, so this
      # builds first. Docker is deliberately not exercised in this job: the
      # lifecycle tests run against a fake ComputeRuntime, which is the point
      # of that seam. Real Docker is the `smoke` job below, kept separate so a
      # red unit suite and a red live run are never confused for each other.
      - name: Test
        run: npm test

  # A live end to end run of the shipped CLI and a real daemon against the
  # runner's own Docker: postgres through the proxy, sleep and wake, an app
  # woken over HTTP, a worker producing to a queue from inside its container
  # and another consuming it, branch, snapshot, eject and rm. See
  # scripts/smoke.mjs for what each scenario asserts.
  #
  # It exists because ubuntu-latest is a real Linux box with Docker, and
  # several claims were waiting on exactly that: issue #14 (the queue producer
  # path, which macOS hides by resolving host.docker.internal for every
  # container) and the Linux ownership gap in docs/branching and docs/backups
  # (a PGDATA owned by the container's postgres uid, read by a daemon running
  # as an ordinary user, which is what the runner user is).
  #
  # Caddy is off (HOBBY_CADDY_ENABLED=false, set by the script). Apps and
  # workers are reached through the HTTP wake router with a Host header, which
  # is the path Caddy itself forwards to; Caddy's own host networking and TLS
  # are not covered here.
  smoke:
    name: live smoke (real Docker, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # psql is the client the scenarios connect with. Docker and the compose
      # plugin are already on the runner image.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Pulled up front so the scenario timings are about hobby rather than
      # the registry. The runtime pulls them anyway if this is ever removed.
      - name: Pre-pull base images
        run: |
          for image in postgres:18-alpine alpine:3.20 oven/bun:1-alpine node:22-bookworm-slim; do
            docker pull -q "$image" &
          done
          wait

      - name: Smoke
        env:
          SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
        run: node scripts/smoke.mjs

      - name: Upload daemon and container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  shell:
    name: install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh scripts/*.sh

      # This exists because of a bug that shipped to hobby.sh/install. A guard
      # that redirected stdin to /dev/tty truncated the script at that line for
      # anyone piping it into bash from a terminal: bash reads the script from
      # stdin, so replacing fd 0 mid-script sends it looking for the rest of
      # the script on the keyboard. The user got a hang or a silent exit 0 with
      # nothing installed.
      #
      # It passed testing at the time because a plain `cat script | bash` in CI
      # has no controlling terminal, which is exactly the case where the guard
      # does nothing. So this test allocates a real PTY, which is the only
      # condition that reproduces it. Do not "simplify" it by dropping script.
      - name: Survives being piped into bash from a real terminal
        run: |
          set -eu
          mkdir -p /tmp/fakerepo && cd /tmp/fakerepo
          git init -q -b main .
          printf '#!/usr/bin/env bash\necho INSTALL_REACHED\n' > install.sh
          chmod +x install.sh
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m fixture
          cd "$GITHUB_WORKSPACE"
          script -qec "cat scripts/web-install.sh | HOBBY_REPO_URL=/tmp/fakerepo HOBBY_SRC_DIR=/tmp/target HOBBY_BIN_DIR=/tmp/bin bash" /dev/null < /dev/null > /tmp/pty.log 2>&1
          echo "--- output under a PTY ---"
          cat /tmp/pty.log
          grep -q INSTALL_REACHED /tmp/pty.log \
            || { echo "FAIL: install.sh was never reached. The script was truncated."; exit 1; }
          test -d /tmp/target \
            || { echo "FAIL: no checkout was created."; exit 1; }
          echo "ok: the whole script ran under a terminal"

  site:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: |
          npm ci
          npm run check:cli
          npm run build
          node scripts/check-links.mjs
